<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Articles - Webelec Stock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-2">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/products.html">⚡ Webelec Stock</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="/products.html">Articles</a></li>
        <li class="nav-item"><a class="nav-link" href="/customers.html">Clients</a></li>
        <li class="nav-item"><a class="nav-link" href="/chantiers.html">Chantiers</a></li>
        <li class="nav-item"><a class="nav-link" href="/vca.html">VCA</a></li>
        <li class="nav-item"><a class="nav-link" href="/vca-test.html">Test VCA</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">Articles</h1>
    <button class="btn btn-primary" onclick="loadProducts()">
      <span>&#x21bb;</span> Rafraichir
    </button>
  </div>

  <div id="alert" class="d-none"></div>

  <div class="table-responsive shadow-sm rounded bg-white">
    <table class="table table-hover table-striped mb-0">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Référence</th>
          <th>Nom</th>
          <th class="text-end">Quantité</th>
          <th class="text-end">Prix (€)</th>
          <th>Créé le</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="product-table-body">
        <tr>
          <td colspan="7" class="text-center text-muted py-4">Chargement...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Suppression -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmer la suppression</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Supprimer l'article <strong id="delete-product-name"></strong> ?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = '/api/products';
  let deleteModal;
  let pendingDeleteId = null;

  document.addEventListener('DOMContentLoaded', () => {
    deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
    document.getElementById('confirm-delete-btn').addEventListener('click', confirmDelete);
    loadProducts();
  });

  async function loadProducts() {
    const tbody = document.getElementById('product-table-body');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Chargement...</td></tr>';
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const products = await res.json();
      renderTable(products);
    } catch (e) {
      showAlert('danger', 'Erreur lors du chargement : ' + e.message);
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Impossible de charger les articles.</td></tr>';
    }
  }

  function renderTable(products) {
    const tbody = document.getElementById('product-table-body');
    if (products.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aucun article.</td></tr>';
      return;
    }
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.id}</td>
        <td><code>${p.reference}</code></td>
        <td>${p.name}</td>
        <td class="text-end">${p.quantity}</td>
        <td class="text-end">${Number(p.price).toFixed(2)}</td>
        <td class="text-muted small">${new Date(p.createdAt).toLocaleDateString('fr-FR')}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-danger" onclick="askDelete(${p.id}, '${escHtml(p.name)}')">
            Supprimer
          </button>
        </td>
      </tr>
    `).join('');
  }

  function askDelete(id, name) {
    pendingDeleteId = id;
    document.getElementById('delete-product-name').textContent = name;
    deleteModal.show();
  }

  async function confirmDelete() {
    if (!pendingDeleteId) return;
    deleteModal.hide();
    try {
      const res = await fetch(`${API_URL}/${pendingDeleteId}`, { method: 'DELETE' });
      if (res.status !== 204) throw new Error(`HTTP ${res.status}`);
      showAlert('success', 'Article supprimé.');
      loadProducts();
    } catch (e) {
      showAlert('danger', 'Erreur lors de la suppression : ' + e.message);
    } finally {
      pendingDeleteId = null;
    }
  }

  function showAlert(type, message) {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type} alert-dismissible fade show`;
    el.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    setTimeout(() => el.classList.add('d-none'), 4000);
  }

  function escHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
