<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chantiers - Webelec Stock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-2">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/products.html">⚡ Webelec Stock</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Articles</a></li>
        <li class="nav-item"><a class="nav-link" href="/customers.html">Clients</a></li>
        <li class="nav-item"><a class="nav-link active" href="/chantiers.html">Chantiers</a></li>
        <li class="nav-item"><a class="nav-link" href="/vca.html">VCA</a></li>
        <li class="nav-item"><a class="nav-link" href="/vca-test.html">Test VCA</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">Chantiers</h1>
    <div class="d-flex gap-2">
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal">+ Nouveau chantier</button>
      <button class="btn btn-outline-secondary" onclick="loadChantiers()">&#x21bb; Rafraichir</button>
    </div>
  </div>

  <div id="alert" class="d-none"></div>

  <div class="table-responsive shadow-sm rounded bg-white">
    <table class="table table-hover table-striped mb-0">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Adresse</th>
          <th>Début</th>
          <th>Fin</th>
          <th>Statut</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="chantier-table-body">
        <tr>
          <td colspan="7" class="text-center text-muted py-4">Chargement...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Création -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nouveau chantier</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="create-form" novalidate>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nom <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="input-name" maxlength="150" required/>
          </div>
          <div class="mb-3">
            <label class="form-label">Adresse <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="input-address" maxlength="255" required/>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Date de début</label>
              <input type="date" class="form-control" id="input-startDate"/>
            </div>
            <div class="col mb-3">
              <label class="form-label">Date de fin</label>
              <input type="date" class="form-control" id="input-endDate"/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Statut <span class="text-danger">*</span></label>
            <select class="form-select" id="input-status" required>
              <option value="EN_COURS">En cours</option>
              <option value="EN_PAUSE">En pause</option>
              <option value="TERMINE">Terminé</option>
              <option value="ANNULE">Annulé</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-success">Créer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Suppression -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmer la suppression</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Supprimer le chantier <strong id="delete-chantier-name"></strong> ?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = '/api/chantiers';
  let deleteModal, createModal;
  let pendingDeleteId = null;

  const STATUS_LABELS = {
    EN_COURS: { label: 'En cours',  badge: 'primary'  },
    EN_PAUSE: { label: 'En pause',  badge: 'warning'  },
    TERMINE:  { label: 'Terminé',   badge: 'success'  },
    ANNULE:   { label: 'Annulé',    badge: 'danger'   }
  };

  document.addEventListener('DOMContentLoaded', () => {
    deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
    createModal = new bootstrap.Modal(document.getElementById('createModal'));

    document.getElementById('confirm-delete-btn').addEventListener('click', confirmDelete);
    document.getElementById('create-form').addEventListener('submit', handleCreate);

    loadChantiers();
  });

  async function loadChantiers() {
    const tbody = document.getElementById('chantier-table-body');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Chargement...</td></tr>';
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const chantiers = await res.json();
      renderTable(chantiers);
    } catch (e) {
      showAlert('danger', 'Erreur lors du chargement : ' + e.message);
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Impossible de charger les chantiers.</td></tr>';
    }
  }

  function formatDate(d) {
    return d ? new Date(d).toLocaleDateString('fr-FR') : '<span class="text-muted">—</span>';
  }

  function renderTable(chantiers) {
    const tbody = document.getElementById('chantier-table-body');
    if (chantiers.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aucun chantier.</td></tr>';
      return;
    }
    tbody.innerHTML = chantiers.map(c => {
      const s = STATUS_LABELS[c.status] ?? { label: c.status, badge: 'secondary' };
      return `
        <tr>
          <td>${c.id}</td>
          <td>${c.name}</td>
          <td class="small text-muted">${c.address}</td>
          <td>${formatDate(c.startDate)}</td>
          <td>${formatDate(c.endDate)}</td>
          <td><span class="badge bg-${s.badge}">${s.label}</span></td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-danger" onclick="askDelete(${c.id}, '${escHtml(c.name)}')">
              Supprimer
            </button>
          </td>
        </tr>`;
    }).join('');
  }

  async function handleCreate(e) {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

    const body = {
      name:      document.getElementById('input-name').value.trim(),
      address:   document.getElementById('input-address').value.trim(),
      startDate: document.getElementById('input-startDate').value || null,
      endDate:   document.getElementById('input-endDate').value || null,
      status:    document.getElementById('input-status').value
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status !== 201) throw new Error(`HTTP ${res.status}`);
      createModal.hide();
      form.reset();
      form.classList.remove('was-validated');
      showAlert('success', 'Chantier créé avec succès.');
      loadChantiers();
    } catch (e) {
      showAlert('danger', 'Erreur lors de la création : ' + e.message);
    }
  }

  function askDelete(id, name) {
    pendingDeleteId = id;
    document.getElementById('delete-chantier-name').textContent = name;
    deleteModal.show();
  }

  async function confirmDelete() {
    if (!pendingDeleteId) return;
    deleteModal.hide();
    try {
      const res = await fetch(`${API_URL}/${pendingDeleteId}`, { method: 'DELETE' });
      if (res.status !== 204) throw new Error(`HTTP ${res.status}`);
      showAlert('success', 'Chantier supprimé.');
      loadChantiers();
    } catch (e) {
      showAlert('danger', 'Erreur lors de la suppression : ' + e.message);
    } finally {
      pendingDeleteId = null;
    }
  }

  function showAlert(type, message) {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type} alert-dismissible fade show`;
    el.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    setTimeout(() => el.classList.add('d-none'), 4000);
  }

  function escHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
