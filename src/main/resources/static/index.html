<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webelec Stock — Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 24px;
        }

        h1 { font-size: 1.6rem; margin-bottom: 24px; color: #1a1a2e; }
        h2 { font-size: 1.1rem; margin-bottom: 16px; color: #444; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            align-items: start;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: #4a6cf7; }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background: #4a6cf7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover { background: #3a5ce4; }

        #message {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
        }

        #message.success { background: #e6f4ea; color: #2d7a3a; display: block; }
        #message.error   { background: #fdecea; color: #c0392b; display: block; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead th {
            text-align: left;
            padding: 10px 12px;
            background: #f7f8fc;
            border-bottom: 2px solid #e5e7eb;
            color: #555;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        tbody tr { border-bottom: 1px solid #f0f0f0; }
        tbody tr:hover { background: #fafbff; }

        tbody td {
            padding: 10px 12px;
            vertical-align: middle;
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #4a6cf7;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-delete:hover { background: #fdecea; }

        .refresh {
            float: right;
            background: none;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.82rem;
            color: #555;
        }

        .refresh:hover { background: #f0f2f5; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-2">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/index.html">⚡ Webelec Stock</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/products.html">Articles</a></li>
        <li class="nav-item"><a class="nav-link" href="/customers.html">Clients</a></li>
        <li class="nav-item"><a class="nav-link" href="/chantiers.html">Chantiers</a></li>
        <li class="nav-item"><a class="nav-link" href="/vca.html">VCA</a></li>
        <li class="nav-item"><a class="nav-link" href="/vca-test.html">Test VCA</a></li>
      </ul>
    </div>
  </div>
</nav>

<h1>Webelec Stock &mdash; Gestion des produits</h1>

<div class="container">

    <!-- Formulaire ajout -->
    <div class="card">
        <h2>Ajouter un produit</h2>
        <form id="productForm">
            <label for="reference">Référence</label>
            <input type="text" id="reference" placeholder="ex: REF-009" required maxlength="50">

            <label for="name">Nom</label>
            <input type="text" id="name" placeholder="ex: Câble 1.5mm" required maxlength="100">

            <label for="quantity">Quantité</label>
            <input type="number" id="quantity" placeholder="ex: 100" required min="0">

            <label for="price">Prix (€)</label>
            <input type="number" id="price" placeholder="ex: 9.99" required min="0.01" step="0.01">

            <button type="submit">Enregistrer</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Liste des produits -->
    <div class="card">
        <h2>
            Liste des produits
            <button class="refresh" onclick="loadProducts()">&#8635; Rafraîchir</button>
        </h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Référence</th>
                    <th>Nom</th>
                    <th>Qté</th>
                    <th>Prix</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="productTable">
                <tr><td colspan="6" style="padding:16px; color:#aaa;">Chargement…</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const API = '/api/products';

    async function loadProducts() {
        const tbody = document.getElementById('productTable');
        tbody.innerHTML = '<tr><td colspan="6" style="padding:16px; color:#aaa;">Chargement…</td></tr>';
        try {
            const res = await fetch(API);
            const products = await res.json();
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding:16px; color:#aaa;">Aucun produit.</td></tr>';
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td><span class="badge">${p.reference}</span></td>
                    <td>${p.name}</td>
                    <td>${p.quantity}</td>
                    <td>${Number(p.price).toFixed(2)} €</td>
                    <td>
                        <button class="btn-delete" title="Supprimer" onclick="deleteProduct(${p.id})">&#128465;</button>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="6" style="color:red; padding:16px;">Erreur de chargement.</td></tr>';
        }
    }

    async function deleteProduct(id) {
        if (!confirm('Supprimer le produit #' + id + ' ?')) return;
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        loadProducts();
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('message');
        msg.className = '';
        msg.style.display = 'none';

        const body = {
            reference: document.getElementById('reference').value.trim(),
            name:      document.getElementById('name').value.trim(),
            quantity:  parseInt(document.getElementById('quantity').value),
            price:     parseFloat(document.getElementById('price').value)
        };

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.status === 201) {
                msg.textContent = 'Produit enregistré avec succès.';
                msg.className = 'success';
                e.target.reset();
                loadProducts();
            } else {
                const err = await res.json();
                msg.textContent = 'Erreur : ' + (err.message || JSON.stringify(err));
                msg.className = 'error';
            }
        } catch (ex) {
            msg.textContent = 'Erreur réseau : ' + ex.message;
            msg.className = 'error';
        }
    });

    loadProducts();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
